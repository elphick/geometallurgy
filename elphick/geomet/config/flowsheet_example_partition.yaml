FLOWSHEET:
  flowsheet:
    name: Flowsheet
  streams:  # graph edges
    Feed:
      name: Feed
      node_in: feed
      node_out: screen
    Coarse:
      name: Coarse
      node_in: screen
      node_out: lump
    Fine:
      name: Fine
      node_in: screen
      node_out: fines
  operations:  # graph nodes
    feed:
      name: feed
    screen:
      name: screen
      type: PartitionOperation
      partition:
        model: napier_munn_size
        args:
          d50: 1.0
          ep: 0.1
        partition_stream: Coarse  # the stream that the partition model defines
    lump:
      name: lump
    fines:
      name: fines
